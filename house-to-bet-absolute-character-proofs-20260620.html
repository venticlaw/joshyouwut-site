<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>House to Bet The House On | Absolute Character Proofs</title>
  <style>
    :root {
      --ink: #070708;
      --coal: #111114;
      --paper: #fbf8f0;
      --gold: #d59b2f;
      --mint: #58b99f;
      --line: rgba(251, 248, 240, 0.18);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, rgba(213, 155, 47, 0.22), transparent 34%),
        radial-gradient(circle at 86% 14%, rgba(66, 103, 178, 0.18), transparent 32%),
        var(--ink);
      color: var(--paper);
      font-family: Inter, Arial, sans-serif;
    }
    main {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font: 900 clamp(34px, 7vw, 92px)/0.9 Arial Black, Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: -1px;
      max-width: 980px;
    }
    .meta {
      color: var(--gold);
      text-align: right;
      text-transform: uppercase;
      font-weight: 900;
      letter-spacing: 0.08em;
      min-width: 220px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }
    .card {
      background: rgba(17, 17, 20, 0.86);
      border: 1px solid var(--line);
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }
    img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }
    .caption {
      padding: 16px 18px 18px;
      border-top: 1px solid var(--line);
    }
    h2 {
      margin: 0 0 6px;
      color: var(--gold);
      font: 900 20px/1.1 Arial Black, Impact, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    p {
      margin: 0;
      color: rgba(251, 248, 240, 0.72);
      line-height: 1.45;
      font-size: 14px;
    }
    @media (max-width: 820px) {
      header { display: block; }
      .meta { text-align: left; margin-top: 14px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Absolute-Style Character Proofs</h1>
      <div class="meta">JoshYouWut<br>House EP</div>
    </header>
    <section class="grid">

        <article class="card">
          <img src="assets/releases/house-to-bet-the-house-on/absolute-proofs/happy-pro.jpg?v=20260620-styleproofs" alt="Happy / Pro absolute-style cover proof">
          <div class="caption">
            <h2>Happy / Pro</h2>
            <p>Main EP / win-state mascot lane</p>
          </div>
        </article>

        <article class="card">
          <img src="assets/releases/house-to-bet-the-house-on/absolute-proofs/sad-problem.jpg?v=20260620-styleproofs" alt="Sad / Problem absolute-style cover proof">
          <div class="caption">
            <h2>Sad / Problem</h2>
            <p>Emotional/problem-state mascot lane</p>
          </div>
        </article>

        <article class="card">
          <img src="assets/releases/house-to-bet-the-house-on/absolute-proofs/angry-feedback.jpg?v=20260620-styleproofs" alt="Angry / Feedback absolute-style cover proof">
          <div class="caption">
            <h2>Angry / Feedback</h2>
            <p>Conflict/critique mascot lane</p>
          </div>
        </article>

        <article class="card">
          <img src="assets/releases/house-to-bet-the-house-on/absolute-proofs/tech-tablet.jpg?v=20260620-styleproofs" alt="Tech / Tablet absolute-style cover proof">
          <div class="caption">
            <h2>Tech / Tablet</h2>
            <p>Studio-tech / bass-analysis mascot lane</p>
          </div>
        </article>

    </section>
  </main>
</body>
</html>
